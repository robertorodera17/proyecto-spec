{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<h1>Ingresar</h1>
{% if aviso %}<p class="aviso">{{ aviso }}</p>{% endif %}
<form method="post" action="/login">
  <label>Sigla <input type="text" name="sigla" value="{{ sigla }}" autofocus required></label>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <p><button type="submit">Continuar</button></p>
</form>
{% endblock %}
